<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#18273d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A gentle, endless bubble popping game for little hands.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="./styles.css">
  <title>Bubble Pop</title>
</head>
<body>
  <canvas id="game" aria-label="Bubble Pop play area"></canvas>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="welcome" class="welcome">
    <div class="welcome-card">
      <div class="hero-bubble" aria-hidden="true"><span></span></div>
      <h1>Bubble Pop</h1>
      <p>Touch the bubbles!</p>
      <button id="start" type="button">Tap to Play</button>
    </div>
  </div>
  <div id="parent-panel" class="welcome parent-panel" hidden>
    <div class="welcome-card">
      <h1>Grown-ups</h1>
      <p>Play settings</p>
      <div class="parent-options">
        <label class="parent-option"><input id="simple-effects" type="checkbox"> Simpler pop effects</label>
        <label class="parent-option"><input id="quiet-sounds" type="checkbox"> Quiet sounds</label>
      </div>
      <button id="resume" type="button">Back to Play</button>
      <p class="parent-hint">Hold a top corner for 1 second to open settings.</p>
    </div>
  </div>
  <script src="./game.js" defer></script>
</body>
</html>
